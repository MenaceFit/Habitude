# Project-wide Gradle settings.

# Increase JVM heap for the Gradle daemon (Compose compilation is memory-hungry).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Use the Gradle daemon and configuration cache for faster incremental builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required (the project uses only AndroidX artifacts).
android.useAndroidX=true

# Kotlin code style used by IDEs opening this project.
kotlin.code.style=official

# Disable unused build features by default; each module opts in explicitly.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
