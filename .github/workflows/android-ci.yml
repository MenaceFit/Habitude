name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run domain module unit tests
        run: ./gradlew :domain:test --stacktrace

      - name: Run app module unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests
            app/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habitude-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # actions/upload-artifact stores through Azure Blob Storage, which
      # isn't reachable from every network this repo's Claude sessions run
      # in. Also publish the debug APK straight into the repo on a small
      # dedicated orphan branch (built fresh in a temp dir, independent of
      # the main checkout) so it's fetchable with plain `git fetch` instead.
      - name: Publish debug APK to the apk-builds branch
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          PUBLISH_DIR="$RUNNER_TEMP/apk-publish"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          cp "$APK_PATH" "$PUBLISH_DIR/habitude-debug.apk"
          cd "$PUBLISH_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add habitude-debug.apk
          git commit -q -m "Debug APK built from ${{ github.sha }}"
          git branch -M apk-builds
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin apk-builds

      - name: Build release APK (unsigned unless keystore secrets are configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "Release keystore secrets found — building a signed release APK."
            ./gradlew :app:assembleRelease --stacktrace \
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore" \
              "-Pandroid.injected.signing.store.password=$RELEASE_KEYSTORE_PASSWORD" \
              "-Pandroid.injected.signing.key.alias=$RELEASE_KEY_ALIAS" \
              "-Pandroid.injected.signing.key.password=$RELEASE_KEY_PASSWORD"
          else
            echo "No release keystore secrets configured — building an unsigned release APK."
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: habitude-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Informational only: lint findings are worth seeing but must never
      # block the APK artifacts above, which are this workflow's real job.
      - name: Lint (debug)
        if: always()
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
